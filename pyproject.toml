[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minispark"
version = "0.1.0"
description = "A first-principles, single-machine distributed data-processing engine (research/educational, not a Spark replacement)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = []

# Milestone 1 has zero third-party runtime dependencies on purpose: the
# data model, expressions, logical plan, naive executor, and CSV reader
# are all built on the standard library. pyarrow/pandas/duckdb/psutil are
# introduced later and are declared as optional extras so they are only
# installed when actually used. `columnar` (pyarrow): Milestone 7's
# storage/parquet.py is the only module that imports it, and even that
# module's callers import it lazily, so installing every other extra, or
# none at all, still leaves every non-Parquet feature fully usable with
# zero third-party deps. `monitoring` (psutil): Milestone 8's execution/
# worker.py attempts the import once at module load (inside a try/except
# ImportError, not a lazy per-call import: execute_task runs for every
# task regardless of what the query does, so there is no feature-
# specific method boundary to defer the import behind the way pyarrow's
# is); cpu_time_seconds/peak_memory_bytes on TaskMetrics simply stay
# None if psutil is not installed.
[project.optional-dependencies]
columnar = ["pyarrow>=15"]
interop = ["pandas>=2", "numpy>=1.26"]
validation = ["duckdb>=0.10"]
monitoring = ["psutil>=5.9"]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
minispark = "minispark.__main__:main"

[tool.setuptools.packages.find]
include = ["minispark*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
